# GameMatch — the whole stack: API, PWA behind Caddy, and (from Task 4) the
# scheduled backup.
#
#   docker compose up --build
#   docker compose run --rm api seed     # first run only; creates demo users
#
# Configuration is read from .env (gitignored, copy .env.example). One file
# serves both hosts: the local machine and the VPS differ only in the values.

name: gamematch

services:
  # The API is reachable only from this compose network.
  #
  # It binds 0.0.0.0 because a container's loopback is its own: Caddy runs in a
  # different container and could never reach 127.0.0.1:8000 there. The
  # exposure that creates is contained by never publishing the port. A
  # `ports:` key here would serve the API unencrypted straight off the host's
  # internet-facing interface — past TLS and past every security header in the
  # Caddyfile, to anyone who can reach the VPS.
  #
  # Do not add ADDR here or to .env. The image sets ENV ADDR=0.0.0.0:8000;
  # compose `environment:` overrides it, but a stray ADDR= in .env would bind
  # loopback and every proxied call would 502 with no other symptom.
  api:
    image: gamematch-api:latest
    # Both keys: the image name lets `docker compose up` reuse an image Task 2
    # already built, and the build section lets `--build` rebuild it. The
    # context is the repository root, so the two images share one .dockerignore.
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    volumes:
      # DATA_DIR=/data comes from the image. The API runs as UID 10001, so
      # ./data must be owned by that UID on the host before the first up:
      #   mkdir -p data backups && sudo chown -R 10001:10001 data
      - ./data:/data
    restart: unless-stopped
    # The server drains for 25s (shutdownGrace in cmd/gamematch/main.go) and
    # Docker's default is 10s, which would SIGKILL in-flight requests on every
    # deploy.
    stop_grace_period: 30s

  # The only service that is exposed. Caddy terminates TLS and serves the PWA;
  # /v1 is reverse-proxied to the api service.
  web:
    image: gamematch-web:latest
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # deploy/Caddyfile defaults this to 127.0.0.1:8000, which is correct on a
      # host running the systemd units. Compose points it at the sibling
      # container instead.
      GAMEMATCH_API: api:8000
      # The domain TLS is issued for. localhost serves HTTPS with Caddy's
      # internal CA — there is no plain-HTTP mode, so both ports are published.
      GAMEMATCH_SITE: ${GAMEMATCH_SITE:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Caddy's own storage. NOT the app's data — the api service bind-mounts
      # the host's ./data to /data, and this is an unrelated path in a
      # different container that merely shares the name.
      #   caddy-data   XDG_DATA_HOME: the ACME account and every certificate
      #   caddy-config XDG_CONFIG_HOME: the autosaved config
      # The image declares no VOLUME for either (verified: `docker image
      # inspect caddy:2.10.2-alpine --format '{{json .Config.Volumes}}'` is
      # null), so without these they sit on the container's writable layer and
      # `docker compose down` destroys them. The next `up` re-runs ACME, and
      # Let's Encrypt permits 5 duplicate certificates per week per registered
      # domain — enough to lock the domain out for the rest of the week.
      - caddy-data:/data
      - caddy-config:/config
      # The access log. Caddy creates this directory itself if it is missing,
      # but the roll_size 100MiB / roll_keep 10 / roll_keep_for 720h policy in
      # deploy/Caddyfile bounds nothing that disappears with the container, and
      # this is the only forensic trail a production deployment leaves.
      - caddy-logs:/var/log/caddy
    depends_on:
      api:
        # The API image declares a HEALTHCHECK with --start-interval=2s, so this
        # costs about two seconds rather than a full 30s interval. web's own
        # /v1 answers 502 until then; every static asset is already servable.
        condition: service_healthy
    restart: unless-stopped
    # Caddy drains in-flight TLS connections when it is sent SIGTERM. Docker's
    # 10s default leaves no headroom, so a request open at deploy time is cut
    # rather than finished. 30s matches the api service.
    stop_grace_period: 30s

# Named, not anonymous: only `docker compose down -v` removes these, and the
# runbook must not use it — the app's ./data is a bind mount and survives that
# anyway, but the certificates above would not.
volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
